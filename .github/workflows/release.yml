name: Create GitHub release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  quality:
    name: Verify release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install developer tools
        run: python -m pip install -r requirements-dev.txt
      - name: Run static checks, tests, and documentation validation
        run: pre-commit run --all-files
      - name: Build strict documentation site
        run: |
          python -m venv .venv-docs
          .venv-docs/bin/python -m pip install --disable-pip-version-check -r requirements-docs.txt
          .venv-docs/bin/zensical build --clean --strict

  release:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Validate semantic version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must follow semantic versioning, for example v0.1.0 or v0.2.0-rc.1"
            exit 1
          fi
      - name: Create GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: gh release create "$RELEASE_TAG" --repo "$REPOSITORY" --verify-tag --generate-notes --title "$RELEASE_TAG"
