name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  standard-library-tests:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library test suite
        run: python -m unittest discover -s tests -v
      - name: Run documentation validator
        run: python scripts/validate_docs.py

  quality:
    name: Lint, types, coverage, and hooks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install developer tools
        run: python -m pip install -r requirements-dev.txt
      - name: Run all pre-commit checks
        run: pre-commit run --all-files

  documentation-site:
    name: Build documentation site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build strict static site
        run: |
          python -m venv .venv-docs
          .venv-docs/bin/python -m pip install --disable-pip-version-check -r requirements-docs.txt
          .venv-docs/bin/zensical build --clean --strict
